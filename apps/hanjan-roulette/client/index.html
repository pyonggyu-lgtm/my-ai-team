<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>점심 메뉴 룰렛</title>
<link rel="preload" href="fonts/Pretendard-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div id="today"></div>
  <div id="wheelWrap"><canvas id="wheel" width="900" height="900"></canvas></div>
  <div id="notice"></div>
  <button id="spin">돌리기</button>
  <div id="hint">스페이스바로도 돌릴 수 있어요</div>
</main>

<aside>
  <h2>메뉴 <span id="count"></span></h2>
  <ul id="list"></ul>
  <form id="addForm" autocomplete="off">
    <input id="addInput" maxlength="20" placeholder="메뉴 추가">
    <button type="submit">추가</button>
  </form>
  <div id="addMsg"></div>
  <div id="foot">
    <button id="snd" type="button">소리 꺼짐</button>
    <button id="resetBtn" type="button">처음 메뉴로 되돌리기</button>
  </div>
</aside>

<div id="toast"></div>

<div id="overlay">
  <canvas id="confetti"></canvas>
  <div id="card">
    <div class="lead">오늘 점심은</div>
    <div class="menu" id="resultName"></div>
    <div>
      <button id="okBtn">이걸로 확정</button>
      <button id="againBtn">다시 돌리기</button>
    </div>
    <button id="closeBtn">닫기</button>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
