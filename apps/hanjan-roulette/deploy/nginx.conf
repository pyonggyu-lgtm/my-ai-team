# 한잔메뉴룰렛 Nginx 설정 (/etc/nginx/sites-available/hanjan 로 복사해 쓴다)
# ─ 경로는 아래 두 곳만 바꾸면 된다 ─
#   앱 경로 APP = /srv/hanjan/apps/hanjan-roulette  (root 줄)
#   Node 서버   = 127.0.0.1:3000                    (upstream 줄)
# ※ 공통 보안 헤더는 server 블록에 한 번만 둔다. location 안에 add_header 를 쓰면
#   바깥 헤더가 상속되지 않으므로, location 에서는 add_header 대신 expires -1 (= Cache-Control: no-cache)을 쓴다.

upstream hanjan_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# 웹소켓 업그레이드용
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name hanjan.pygprg.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;       # Nginx 1.24: 'http2 on;' 지시어는 1.25.1부터라 listen 에 붙인다
    listen [::]:443 ssl http2;
    server_name hanjan.pygprg.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/hanjan.pygprg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hanjan.pygprg.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/hanjan/apps/hanjan-roulette/client;
    index index.html;
    client_max_body_size 1m;   # 그룹 만들기 본문 한도(서버 bigJson 1mb)

    # ── 보안 헤더 (모두 always) ──
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # 앱이 쓰는 것만 연다: 스크립트·CSS·글꼴 모두 같은 출처 파일, index.html 의 style="" 속성 때문에 style-src-attr 만 inline 허용,
    # 아이콘/캔버스용 data:, 실시간은 같은 출처 웹소켓.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://hanjan.pygprg.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ── API / 실시간 → Node ──
    location /api/ {
        proxy_pass http://hanjan_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # 클라이언트가 보낸 값은 믿지 않고 덮어쓴다
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://hanjan_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── 항상 최신이어야 하는 파일 ──
    location = /sw.js         { expires -1; try_files $uri =404; }
    location = /index.html    { expires -1; try_files $uri =404; }
    location = /manifest.json { expires -1; try_files $uri =404; }

    # favicon.ico 요청은 아이콘 PNG 로 넘긴다
    location = /favicon.ico {
        rewrite ^ /icons/icon-192.png last;
    }

    # 나머지 정적 파일: 파일 이름에 해시가 없으므로 오래 캐시하지 않는다
    # 없는 파일은 404 (index.html 을 200 으로 주면 서비스 워커가 HTML 을 그 이름으로 저장할 수 있음)
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
